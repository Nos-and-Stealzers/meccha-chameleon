<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Meccha Server Manager</title>
<style>
:root{--bg:#0b0e15;--panel:rgba(22,27,40,.9);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--text:#f2f4f8;--muted:#9aa4b8;--dim:#6b7488;--accent:#38e0a0;--yellow:#ffd23f;--bad:#ff5468;--warn:#ffc53d;--blue:#4ea8ff;
  --display:"Bahnschrift","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;--body:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:radial-gradient(ellipse at 20% 0,#17203a,var(--bg) 60%);color:var(--text);font:14px/1.45 var(--body)}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line)}
.brand{font:800 16px/0.95 var(--display);letter-spacing:.06em}.brand span{display:block;color:#ff6fae}.brand b{color:var(--accent)}
header h1{font:700 20px var(--display);letter-spacing:.08em;text-transform:uppercase;margin:0 0 0 6px}
header .sum{color:var(--muted);margin-left:auto;font-size:13px}
button{font:600 13px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--text);cursor:pointer;border:1px solid var(--line2);background:rgba(255,255,255,.07);padding:9px 14px;border-radius:8px}
button:hover{background:rgba(255,255,255,.13)}
button.cta{background:var(--yellow);color:#2a2000;border-color:transparent}button.cta:hover{background:#ffe066}
button.danger:hover{border-color:var(--bad);color:#ff9aa7}
button.ghost{background:none;border-color:transparent;color:var(--muted)}button.ghost:hover{color:var(--text)}
button:disabled{opacity:.4;cursor:default}
main{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px}
#list{display:flex;flex-direction:column;gap:10px}
.bar{display:flex;gap:8px;align-items:center}
.bar .sp{flex:1}
label.chk{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center}
.dot{width:12px;height:12px;border-radius:50%;background:var(--dim)}
.dot.running{background:var(--accent);box-shadow:0 0 0 4px rgba(56,224,160,.15)}.dot.starting{background:var(--warn)}.dot.error{background:var(--bad)}
.card h2{margin:0;font:700 18px var(--display);letter-spacing:.03em}
.meta{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--muted);font-size:13px}
.meta b{color:var(--text);font-weight:600}
.actions{grid-row:1/3;grid-column:3;display:flex;gap:6px}
.err{grid-column:2/4;color:#ff9aa7;font-size:13px}
.addr{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
code{background:rgba(255,255,255,.07);padding:3px 8px;border-radius:5px;font:12px ui-monospace,Consolas,monospace;user-select:text}
details{grid-column:1/4}
summary{cursor:pointer;color:var(--dim);font-size:12px}
pre{margin:8px 0 0;max-height:160px;overflow:auto;background:rgba(0,0,0,.35);border-radius:8px;padding:8px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;color:#c8d0dc;user-select:text}
.edit{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.edit table{width:100%;border-collapse:collapse}
.edit th{font:600 11px var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:4px 6px}
.edit td{padding:4px 6px}
input{font:inherit;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;width:100%;outline:none}
input:focus{border-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.hint{color:var(--dim);font-size:12px;margin:10px 0 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#141927;border:1px solid var(--line2);border-left:3px solid var(--bad);padding:9px 16px;border-radius:6px;display:none}
</style>
</head>
<body>
<header>
  <div class="brand"><span>MECCHA</span><b>CHAMELEON</b></div>
  <h1>Server Manager</h1>
  <div class="sum" id="sum"></div>
</header>
<main>
  <div class="bar">
    <button class="cta" id="startAll">Start all</button>
    <button class="danger" id="stopAll">Stop all</button>
    <span class="sp"></span>
    <label class="chk"><input type="checkbox" id="autoStart"> Start all servers when this opens</label>
    <button class="ghost" id="editBtn">Edit servers</button>
  </div>
  <div id="list"></div>
  <section class="edit" id="edit" hidden>
    <table><thead><tr><th>On</th><th>Name</th><th>Port</th><th>Max players</th><th>Password</th><th></th></tr></thead><tbody id="rows"></tbody></table>
    <div class="bar" style="margin-top:10px"><button id="addRow">Add server</button><span class="sp"></span><button class="ghost" id="openCfg">Show config file</button><button class="ghost" id="cancelEdit">Cancel</button><button class="cta" id="saveEdit">Save</button></div>
    <p class="hint">Every server needs its own port. People on your Wi-Fi see these servers in the game's Servers tab automatically; friends elsewhere join with your Tailscale address or a forwarded port.</p>
  </section>
</main>
<div id="toast"></div>
<script src="servers.js"></script>
</body>
</html>
